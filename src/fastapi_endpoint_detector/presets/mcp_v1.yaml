schema_version: 2
preset:
  id: mcp-surfaces
  version: "1"
  provenance:
    kind: preset
    source: fastapi-endpoint-detector
    revision: "1"
contracts:
  - id: fastmcp-tool-decorator
    registration:
      symbol: fastmcp.FastMCP.tool
      invocation: instance_method
      receiver_type: fastmcp.FastMCP
    handler:
      kind: decorated_function
    surface:
      kind: mcp.tool
      id_template: "tool:{resource}"
      resource:
        kind: keyword_or_handler_name
        name: name
    callback_mode: either
    execution_mode: framework

  - id: fastmcp-resource-decorator
    registration:
      symbol: fastmcp.FastMCP.resource
      invocation: instance_method
      receiver_type: fastmcp.FastMCP
    handler:
      kind: decorated_function
    surface:
      kind: mcp.resource
      id_template: "resource:{resource}"
      resource:
        kind: argument_or_keyword
        index: 0
        name: uri
    callback_mode: either
    execution_mode: framework

  - id: fastmcp-prompt-decorator

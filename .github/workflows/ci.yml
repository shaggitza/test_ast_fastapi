# Continuous Integration Workflow
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check src/ tests/

      - name: Run mypy
        run: mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - python-version: "3.10"
            replay-python: "3.10.21"
          - python-version: "3.11"
            replay-python: "3.11.16"
          - python-version: "3.12"
            replay-python: "3.12.14"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.replay-python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Historical replay verifies exact interpreter and dependency identities.
          # Export the authenticated replay lock without changing frozen artifacts.
          python -m pip install "uv==0.12.19"
          uv export --frozen \
            --project "benchmarks/results/effect-preset-matrix-v5/replay-envs/python-${{ matrix.replay-python }}-mypy-1.19.1" \
            --format requirements-txt --no-hashes \
            --output-file "$RUNNER_TEMP/replay-constraints.txt"
          pip install -e ".[dev]" -c "$RUNNER_TEMP/replay-constraints.txt"

      - name: Run tests in resource-bounded processes
        run: |
          rm -f .coverage .coverage.*
          python scripts/run_tests_bounded.py tests \
            --pytest-arg=--cov=src/fastapi_endpoint_detector \
            --pytest-arg=--cov-append \
            --pytest-arg=--cov-report= \
            --pytest-arg=--cov-fail-under=0
          python -m coverage report --fail-under=80
          python -m coverage xml --fail-under=0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  fastapi-compat:
    name: FastAPI Minimum Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimum supported FastAPI
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "fastapi==0.100.0"

      - name: Run runtime extractor compatibility tests
        run: pytest -q tests/unit/test_fastapi_extractor.py

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test, fastapi-compat]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Verify typed wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "fastapi_endpoint_detector/py.typed",
              "fastapi_endpoint_detector/presets/effects_sqlalchemy_v1.yaml",
              "fastapi_endpoint_detector/presets/framework_v1.yaml",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing required files: {sorted(missing)}")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
